[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airpods-cli"
version = "0.1.0"
description = "A CLI tool to switch AirPods listening modes (ANC, Transparency, Adaptive, Off) from the terminal"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "aryan2-7", email = "" }]
keywords = ["airpods", "macos", "bluetooth", "cli", "anc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

dependencies = ["click>=8.1.0"]

[project.scripts]
airpods = "airpods_cli.cli:cli"

[project.urls]
Homepage = "https://github.com/aryan2-7/airpods-cli"
Repository = "https://github.com/aryan2-7/airpods-cli"
Issues = "https://github.com/aryan2-7/airpods-cli/issues"

[tool.uv]
dev-dependencies = ["pytest>=8.0.0", "ruff>=0.4.0"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
